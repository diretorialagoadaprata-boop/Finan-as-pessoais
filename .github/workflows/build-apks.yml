name: Build Financas Facil APKs

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [v1, v2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle :${{ matrix.app }}:assembleDebug --stacktrace
      - name: Rename APK
        shell: bash
        run: |
          if [ "${{ matrix.app }}" = "v1" ]; then NAME="FinancasFacil-V1.apk"; else NAME="FinancasFacil-V2.apk"; fi
          cp "${{ matrix.app }}/build/outputs/apk/debug/${{ matrix.app }}-debug.apk" "$NAME"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
