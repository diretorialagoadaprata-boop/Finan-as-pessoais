name: Build Financas Facil V1 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-v1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build V1 APK
        run: gradle :v1:assembleDebug --stacktrace
      - name: Rename APK
        run: cp "v1/build/outputs/apk/debug/v1-debug.apk" "FinancasFacil-V1.apk"
      - name: Upload V1 APK
        uses: actions/upload-artifact@v4
        with:
          name: FinancasFacil-V1.apk
          path: FinancasFacil-V1.apk
          if-no-files-found: error
