name: Build Financas Facil V1 Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-v1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build unsigned release
        run: gradle :v1:assembleRelease --stacktrace
      - name: Align unsigned APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 \
            v1/build/outputs/apk/release/v1-release-unsigned.apk \
            FinancasFacil-V1-unsigned-aligned.apk
      - name: Copy Android signing tool
        run: cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" apksigner.jar
      - name: Upload unsigned release and signing tool
        uses: actions/upload-artifact@v4
        with:
          name: FinancasFacil-V1-release-kit
          path: |
            FinancasFacil-V1-unsigned-aligned.apk
            apksigner.jar
          if-no-files-found: error
